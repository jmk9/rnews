# Robot NEWS (RNEWS) — configuration

# Keywords that an item should contain at least one of (in title or abstract/README).
# Used to filter out obviously-unrelated items before scoring.
must_match_keywords:
  - robot
  - robotic
  - manipulation
  - locomotion
  - grasping
  - humanoid
  - quadruped
  - drone
  - reinforcement learning
  - policy learning
  - imitation learning
  - vision-language-action
  - vla
  - diffusion policy
  - sim-to-real
  - sim2real
  - mobile manipulation
  - multi-robot
  - ros2
  - isaac
  - mujoco
  # Korean keywords — let Korean-language news (로봇신문, AI타임스) pass the filter
  - 로봇
  - 로봇팔
  - 휴머노이드
  - 협동로봇
  - 매니퓰레이터
  - 사족보행
  - 보행로봇
  - 강화학습
  - 모방학습
  - 그리퍼
  - 로봇손
  - 양팔로봇
  - 물류로봇
  - 산업용로봇

# Hard-exclude clearly out-of-scope topics even if they trip a must_match
# keyword (e.g. an RL paper that's really about finance, or a "policy" that's
# video generation). Dropped before ranking. Substring, case-insensitive.
exclude_keywords:
  - self-driving
  - "self driving"
  - autonomous driving
  - autonomous vehicle
  - 자율주행
  - financial
  - stock trading
  - stock market
  - portfolio
  - algorithmic trading
  - video generation
  - text-to-video
  - "text to video"
  - image generation
  - text-to-image
  - "text to image"
  - recommendation system

# Research areas you care about most. Items matching these get a relevance boost.
research_interests:
  - robot learning
  - reinforcement learning
  - diffusion policy
  - vision-language-action
  - vla
  - sim-to-real
  - mobile manipulation
  - multi-robot
  - humanoid
  - physical ai
  - world model
  - offline rl
  - rlpd
  - serl
  - hil-serl
  - dreamerv3
  - td-mpc

# Tag taxonomy. Two orthogonal axes:
#   - Method: how the policy was trained (#RL, #IL, #VLA)
#   - Platform: what kind of robot was trained on (#Manipulator, #Humanoid, ...)
# Items can carry tags from both axes (a bimanual humanoid VLA paper gets four
# tags). Add more tags here if and only if a daily scan reveals a category that
# genuinely needs its own bucket — see SELF_FEEDBACK.md for the rule.
tags:
  # ---- Method ----
  "#RL":
    - reinforcement learning
    - " rl "
    - policy gradient
    - ppo
    - "proximal policy"
    - " sac "
    - "soft actor-critic"
    - "soft actor critic"
    - offline rl
    - "offline reinforcement"
    - iql
    - cql
    - awr
    - world model
    - dreamer
    - td-mpc
    - "model-based rl"
    - hil-serl
    - " serl "
    - rlpd
    - "human-in-the-loop rl"
  "#IL":
    - imitation learning
    - "behavior cloning"
    - "behaviour cloning"
    - diffusion policy
    - dppo
    - "diffusion-based policy"
    - "interactive imitation"
  "#VLA":
    - vla                      # also catches openvla / smolvla / cogvla
    - vision-language-action
    - "vision language action"
    - openvla
    # NOTE: "foundation model" / "pretrained policy" removed — too broad.
    # A robotics foundation model is not necessarily a VLA (e.g. Genesis AI's
    # GENE was tagged #VLA only because it said "foundation model").

  # ---- Platform (cobot family + humanoid).
  # Humanoid kept because modern bipedal robots (Figure, 1X, Optimus, H1)
  # increasingly target collaborative / shared-workspace deployment.
  # Quadrupeds / UGVs / drones remain out of scope.
  "#Manipulator":
    - manipulator
    - manipulation        # general manipulation work counts as arm/manipulator
    - "robot arm"
    - "robotic arm"
    - grasping
    - grasp
    - "pick and place"
    - "pick-and-place"
    - dexterous
    - "end-effector"
    - "end effector"
    - "franka"
    - "panda arm"
    - "ur5"
    - "ur10"
    - "ur3"
    - "kuka"
    - "xarm"
    - "iiwa"
    - 로봇팔
    - 매니퓰레이터
    - 그리퍼
    - 파지
    - 집기
  "#Bimanual":
    - bimanual
    - "two-arm"
    - "dual-arm"
    - "two arm"
    - "dual arm"
    - "two-handed"
    - aloha
    - 양팔
    - 양손
  "#MobileManipulator":
    - mobile manipulator
    - "mobile manipulation"
    - "stretch robot"
    - "hello robot stretch"
    - tiago
    - "fetch robot"
    - "mobile aloha"
    - tidybot
    - "wheeled manipulator"
    - 모바일 매니퓰레이터
    - 이동 조작
  "#Humanoid":
    - humanoid
    - bipedal
    - biped
    - "boston dynamics atlas"
    - "unitree h1"
    - "unitree g1"
    - "tesla optimus"
    - "figure 01"
    - "figure 02"
    - "1x neo"
    - "agility digit"
    - "whole-body humanoid"
    - 휴머노이드
    - 이족보행
    - 인간형 로봇

# Tag chip groups. Method and Platform are **independent filter dimensions** —
# users can pick one from each (e.g. #VLA + #Manipulator). The site renders
# them as two chip rows with separate `data-filter` keys.
tag_groups:
  - label: Method
    filter_key: method
    tags: ["#RL", "#IL", "#VLA"]
  - label: Platform
    filter_key: platform
    # #Other is the platform catch-all — items matching none of the 4 above.
    tags: ["#Manipulator", "#Bimanual", "#MobileManipulator", "#Humanoid", "#Other"]

sources:
  arxiv:
    enabled: true
    categories: [cs.RO, cs.AI, cs.LG, cs.CV]
    days_back: 7
    max_results_per_category: 100
  github:
    enabled: true
    queries:
      - "robot learning"
      - "diffusion policy"
      - "vision language action"
      - "reinforcement learning robot"
      - "sim-to-real"
      - "isaac lab"
    days_back: 90
    per_page: 30
    min_stars: 10
  news:
    enabled: true
    days_back: 21         # show items posted within the last 3 weeks
    max_per_feed: 40      # cap per feed so a noisy outlet can't drown the rest
    feeds:
      # --- robotics-focused ---
      - name: "Robohub"
        url: "https://robohub.org/feed/"
      - name: "IEEE Spectrum — Robotics"
        url: "https://spectrum.ieee.org/feeds/topic/robotics.rss"
      - name: "TechCrunch — Robotics"
        url: "https://techcrunch.com/category/robotics/feed/"
      - name: "MIT News — Robotics"
        url: "https://news.mit.edu/topic/mitrobotics-rss.xml"
      - name: "Robotics and Automation News"
        url: "https://roboticsandautomationnews.com/feed/"
      # --- AI / tech (filtered by robotics keywords downstream) ---
      - name: "The Verge — AI"
        url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
      - name: "Ars Technica"
        url: "https://feeds.arstechnica.com/arstechnica/index"
      - name: "Synced"
        url: "https://syncedreview.com/feed/"
      - name: "BAIR Blog (Berkeley AI Research)"
        url: "https://bair.berkeley.edu/blog/feed.xml"
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "Robotics Tomorrow"
        url: "https://www.roboticstomorrow.com/rss/news.xml"
      - name: "NVIDIA Developer Blog"
        url: "https://developer.nvidia.com/blog/feed/"
      - name: "NVIDIA Blog"
        url: "https://blogs.nvidia.com/feed/"
      - name: "DeepMind Blog"
        url: "https://deepmind.google/blog/rss.xml"
      - name: "Hacker News (front page, filtered downstream)"
        url: "https://hnrss.org/frontpage?points=100"
      # --- Korean ---
      - name: "로봇신문 (irobotnews)"
        url: "http://www.irobotnews.com/rss/allArticle.xml"
      - name: "AI타임스"
        url: "https://www.aitimes.com/rss/allArticle.xml"
      - name: "인공지능신문"
        url: "https://www.aitimes.kr/rss/allArticle.xml"

# Weights used by ranker.compute_score().
# Sort policy: bias toward what people actually USE and TRUST.
#   - github_stars_log dominates for repos (popularity = trust proxy)
#   - github_forks_log secondary (forks = real usage, not bookmarks)
#   - has_code matters a lot (J2: find code I can run)
#   - real_robot matters (effectiveness — papers that touched hardware)
ranking:
  title_keyword: 3.0          # per must_match keyword hit in title
  abstract_keyword: 1.0       # per must_match keyword hit in abstract/readme
  research_interest_title: 5.0   # per research_interest hit in title
  research_interest_abstract: 2.0 # per research_interest hit in abstract/readme
  recency: 3.0                # 0..1 scaled by how recent within days_back
  has_code: 6.0               # bumped — code release is a strong "actually useful" signal
  github_stars_log: 5.0       # bumped — popularity dominates the ordering for repos
  github_forks_log: 2.0       # NEW — forks indicate real downstream usage
  real_robot: 3.0             # bumped — practical effectiveness signal for papers

# Priority thresholds applied to final score
priority:
  must_read_threshold: 12.0
  low_priority_threshold: 4.0

paths:
  raw: data/raw
  processed: data/processed
  reports: reports

# Report rendering caps
report:
  top_papers: 15
  top_repos: 10
  summary_max_chars: 320

# Card summaries. Swap provider here — one line — to move between backends.
#   provider: codex    -> OpenAI Codex CLI via your ChatGPT-extension OAuth
#                          login. No API key, no extra billing. LOCAL ONLY
#                          (the binary + auth don't exist on GitHub Actions),
#                          and slow (~10-20s/item). Current choice.
#   provider: openai   -> OPENAI_API_KEY. Fast, automatable on CI, pay-as-you-go.
#   provider: claude   -> ANTHROPIC_API_KEY. Switch here later.
#   provider: truncation -> no API, keeps source text (free fallback).
#   provider: auto     -> codex if found, else whichever API key is present.
# If the chosen provider is unavailable at runtime it falls back to truncation,
# so the pipeline never breaks (e.g. CI without the codex binary).
summarizer:
  provider: codex
  codex_binary: ""                # auto-discovered from the VS Code extension if empty
  codex_model: ""                 # optional, e.g. gpt-5-mini (lighter = less quota)
  codex_reasoning_effort: low     # low/minimal — summaries don't need xhigh (saves ChatGPT quota)
  openai_model: gpt-4o-mini       # used when provider: openai
  openai_base_url: ""             # optional: OpenAI-compatible endpoint
  claude_model: claude-haiku-4-5-20251001
  truncation_max_chars: 10000

# First-seen tracking: lets daily mode highlight only items new since the last run.
state:
  seen_path: data/state/seen.json

# Static HTML site (shareable with colleagues via any web server).
site:
  enabled: true
  output_dir: site
  templates_dir: templates
  title: "RNEWS — Robot NEWS"
  description: "Daily picks in robot learning — RL / IL / VLA across cobot arms, bimanual, mobile manipulators, and humanoids."
  url: ""              # If hosted, set absolute URL — used for RSS <link>.
  items_on_index: 1500  # cap for non-news items (papers + repos)
  news_min_slots: 90   # ensure at least this many news items always visible
  top_tags: 16         # how many tag-filter chips to expose
