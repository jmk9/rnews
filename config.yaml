# Robot NEWS (RNEWS) — configuration

# Keywords that an item should contain at least one of (in title or abstract/README).
# Used to filter out obviously-unrelated items before scoring.
must_match_keywords:
  - robot
  - robotic
  - manipulation
  - locomotion
  - grasping
  - humanoid
  - quadruped
  - drone
  - autonomous
  - reinforcement learning
  - policy learning
  - imitation learning
  - vision-language-action
  - vla
  - diffusion policy
  - sim-to-real
  - sim2real
  - mobile manipulation
  - multi-robot
  - ros2
  - isaac
  - mujoco

# Research areas you care about most. Items matching these get a relevance boost.
research_interests:
  - robot learning
  - reinforcement learning
  - diffusion policy
  - vision-language-action
  - vla
  - sim-to-real
  - mobile manipulation
  - multi-robot
  - humanoid
  - physical ai
  - world model
  - offline rl
  - rlpd
  - serl
  - hil-serl
  - dreamerv3
  - td-mpc

# Tag taxonomy. Two orthogonal axes:
#   - Method: how the policy was trained (#RL, #IL, #VLA)
#   - Platform: what kind of robot was trained on (#Manipulator, #Humanoid, ...)
# Items can carry tags from both axes (a bimanual humanoid VLA paper gets four
# tags). Add more tags here if and only if a daily scan reveals a category that
# genuinely needs its own bucket — see SELF_FEEDBACK.md for the rule.
tags:
  # ---- Method ----
  "#RL":
    - reinforcement learning
    - " rl "
    - policy gradient
    - ppo
    - "proximal policy"
    - " sac "
    - "soft actor-critic"
    - "soft actor critic"
    - offline rl
    - "offline reinforcement"
    - iql
    - cql
    - awr
    - world model
    - dreamer
    - td-mpc
    - "model-based rl"
    - hil-serl
    - " serl "
    - rlpd
    - "human-in-the-loop rl"
  "#IL":
    - imitation learning
    - "behavior cloning"
    - "behaviour cloning"
    - diffusion policy
    - dppo
    - "diffusion-based policy"
    - "interactive imitation"
  "#VLA":
    - vla
    - vision-language-action
    - "vision language action"
    - openvla
    - foundation model
    - "pre-trained policy"
    - "pretrained policy"

  # ---- Platform (cobot family + humanoid).
  # Humanoid kept because modern bipedal robots (Figure, 1X, Optimus, H1)
  # increasingly target collaborative / shared-workspace deployment.
  # Quadrupeds / UGVs / drones remain out of scope.
  "#Manipulator":
    - manipulator
    - "robot arm"
    - "robotic arm"
    - "franka"
    - "panda arm"
    - "ur5"
    - "ur10"
    - "ur3"
    - "kuka"
    - "xarm"
    - "iiwa"
    - "tabletop manipulation"
    - "table-top manipulation"
  "#Bimanual":
    - bimanual
    - "two-arm"
    - "dual-arm"
    - "two arm"
    - "dual arm"
    - aloha
  "#MobileManipulator":
    - mobile manipulator
    - "mobile manipulation"
    - "stretch robot"
    - "hello robot stretch"
    - tiago
    - "fetch robot"
    - "mobile aloha"
    - tidybot
  "#Humanoid":
    - humanoid
    - bipedal
    - biped
    - "boston dynamics atlas"
    - "unitree h1"
    - "unitree g1"
    - "tesla optimus"
    - "figure 01"
    - "figure 02"
    - "1x neo"
    - "agility digit"
    - "whole-body humanoid"

# Tag chip groups. Method and Platform are **independent filter dimensions** —
# users can pick one from each (e.g. #VLA + #Manipulator). The site renders
# them as two chip rows with separate `data-filter` keys.
tag_groups:
  - label: Method
    filter_key: method
    tags: ["#RL", "#IL", "#VLA"]
  - label: Platform
    filter_key: platform
    tags: ["#Manipulator", "#Bimanual", "#MobileManipulator", "#Humanoid"]

sources:
  arxiv:
    enabled: true
    categories: [cs.RO, cs.AI, cs.LG, cs.CV]
    days_back: 7
    max_results_per_category: 100
  github:
    enabled: true
    queries:
      - "robot learning"
      - "diffusion policy"
      - "vision language action"
      - "reinforcement learning robot"
      - "sim-to-real"
      - "isaac lab"
    days_back: 90
    per_page: 30
    min_stars: 10
  news:
    enabled: true
    days_back: 14         # show items posted within the last 2 weeks
    max_per_feed: 25      # cap per feed so a noisy outlet can't drown the rest
    feeds:
      - name: "The Robot Report"
        url: "https://www.therobotreport.com/feed/"
      - name: "IEEE Spectrum — Robotics"
        url: "https://spectrum.ieee.org/topic/robotics/feed"
      - name: "TechCrunch — Robotics"
        url: "https://techcrunch.com/category/robotics/feed/"
      - name: "MIT News — Robotics"
        url: "https://news.mit.edu/topic/mitrobotics-rss.xml"
      - name: "VentureBeat — AI"
        url: "https://venturebeat.com/category/ai/feed/"
      - name: "Robotics and Automation News"
        url: "https://roboticsandautomationnews.com/feed/"
      - name: "NVIDIA Blog"
        url: "https://blogs.nvidia.com/feed/"
      - name: "DeepMind Blog"
        url: "https://deepmind.google/blog/rss.xml"
      - name: "Hacker News (front page, filtered downstream)"
        url: "https://hnrss.org/frontpage?points=100"

# Weights used by ranker.compute_score().
# Sort policy: bias toward what people actually USE and TRUST.
#   - github_stars_log dominates for repos (popularity = trust proxy)
#   - github_forks_log secondary (forks = real usage, not bookmarks)
#   - has_code matters a lot (J2: find code I can run)
#   - real_robot matters (effectiveness — papers that touched hardware)
ranking:
  title_keyword: 3.0          # per must_match keyword hit in title
  abstract_keyword: 1.0       # per must_match keyword hit in abstract/readme
  research_interest_title: 5.0   # per research_interest hit in title
  research_interest_abstract: 2.0 # per research_interest hit in abstract/readme
  recency: 3.0                # 0..1 scaled by how recent within days_back
  has_code: 6.0               # bumped — code release is a strong "actually useful" signal
  github_stars_log: 5.0       # bumped — popularity dominates the ordering for repos
  github_forks_log: 2.0       # NEW — forks indicate real downstream usage
  real_robot: 3.0             # bumped — practical effectiveness signal for papers

# Priority thresholds applied to final score
priority:
  must_read_threshold: 12.0
  low_priority_threshold: 4.0

paths:
  raw: data/raw
  processed: data/processed
  reports: reports

# Report rendering caps
report:
  top_papers: 15
  top_repos: 10
  summary_max_chars: 320

# First-seen tracking: lets daily mode highlight only items new since the last run.
state:
  seen_path: data/state/seen.json

# Static HTML site (shareable with colleagues via any web server).
site:
  enabled: true
  output_dir: site
  templates_dir: templates
  title: "RNEWS — Robot NEWS"
  description: "Daily picks in robot learning — RL / IL / VLA across manipulators, humanoids, quadrupeds, drones and more. Sorted by how much people actually use it."
  url: ""              # If hosted, set absolute URL — used for RSS <link>.
  items_on_index: 1500  # how many items the front page renders (client-side time filter narrows from this pool)
  top_tags: 16         # how many tag-filter chips to expose
