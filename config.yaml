# Robot NEWS (RNEWS) — configuration

# Keywords that an item should contain at least one of (in title or abstract/README).
# Used to filter out obviously-unrelated items before scoring.
must_match_keywords:
  - robot
  - robotic
  - manipulation
  - locomotion
  - grasping
  - humanoid
  - quadruped
  - drone
  - reinforcement learning
  - policy learning
  - imitation learning
  - vision-language-action
  - vla
  - diffusion policy
  - sim-to-real
  - sim2real
  - mobile manipulation
  - multi-robot
  - ros2
  - isaac
  - mujoco
  # Korean keywords — let Korean-language news (로봇신문, AI타임스) pass the filter
  - 로봇
  - 로봇팔
  - 휴머노이드
  - 협동로봇
  - 매니퓰레이터
  - 사족보행
  - 보행로봇
  - 강화학습
  - 모방학습
  - 그리퍼
  - 로봇손
  - 양팔로봇
  - 물류로봇
  - 산업용로봇

# Hard-exclude clearly out-of-scope topics even if they trip a must_match
# keyword (e.g. an RL paper that's really about finance, or a "policy" that's
# video generation). Dropped before ranking. Substring, case-insensitive.
exclude_keywords:
  - self-driving
  - "self driving"
  - autonomous driving
  - autonomous vehicle
  - 자율주행
  - financial
  - stock trading
  - stock market
  - portfolio
  - algorithmic trading
  - video generation
  - text-to-video
  - "text to video"
  - image generation
  - text-to-image
  - "text to image"
  - recommendation system
  - 주식 시세
  - 주가 시세

# Business-news patterns to DEMOTE (not exclude). Each match in the title
# applies a negative score (config.ranking.demote_penalty, default -6) so
# pure funding / investment headlines get pushed from High to Mid or Low
# without dropping them entirely. Tech-content posts that happen to mention
# funding still score high overall via their other signals.
demote_keywords:
  # English
  - "raises $"
  - " seed round"
  - " series a"
  - " series b"
  - " series c"
  - " series d"
  - " funding round"
  - "raised $"
  - "valuation"
  - "secures $"
  - "secures funding"
  - "led the round"
  - "led by"
  # Korean
  - 투자 유치
  - 시드 라운드
  - 시드라운드
  - 시리즈 a
  - 시리즈 b
  - 시리즈 c
  - 시리즈 d
  - 라운드서
  - 조달
  - 펀딩
  - 기업가치
  - 1조 원
  - 라운드 마감

# Research areas you care about most. Items matching these get a relevance boost.
research_interests:
  - robot learning
  - reinforcement learning
  - diffusion policy
  - vision-language-action
  - vla
  - sim-to-real
  - mobile manipulation
  - multi-robot
  - humanoid
  - physical ai
  - world model
  - offline rl
  - rlpd
  - serl
  - hil-serl
  - dreamerv3
  - td-mpc
  # Korean equivalents — Korean-language news (로봇신문, AI타임스 등) was
  # systematically capped at Mid because these +5 boosts only fired on English
  # titles. Listed only where the term actually appears in Korean news text.
  - 휴머노이드
  - 피지컬 AI
  - 강화학습

# Tag taxonomy. Two orthogonal axes:
#   - Method: how the policy was trained (#RL, #IL, #VLA)
#   - Platform: what kind of robot was trained on (#Manipulator, #Humanoid, ...)
# Items can carry tags from both axes (a bimanual humanoid VLA paper gets four
# tags). Add more tags here if and only if a daily scan reveals a category that
# genuinely needs its own bucket — see SELF_FEEDBACK.md for the rule.
tags:
  # ---- Method ----
  "#RL":
    - reinforcement learning
    - " rl "
    - policy gradient
    - ppo
    - "proximal policy"
    - " sac "
    - "soft actor-critic"
    - "soft actor critic"
    - offline rl
    - "offline reinforcement"
    - iql
    - cql
    - awr
    - world model
    - dreamer
    - td-mpc
    - "model-based rl"
    - hil-serl
    - " serl "
    - rlpd
    - "human-in-the-loop rl"
  "#IL":
    - imitation learning
    - "behavior cloning"
    - "behaviour cloning"
    - diffusion policy
    - dppo
    - "diffusion-based policy"
    - "interactive imitation"
  "#VLA":
    # In robotics, "foundation model" predominantly means a VLA / generalist
    # policy (RT-2, OpenVLA, π0, GR00T, Octo), so they share one tag. (World
    # models are the exception but we don't tag those.)
    - vla                      # also catches openvla / smolvla / cogvla
    - vision-language-action
    - "vision language action"
    - openvla
    - foundation model
    - "robot foundation model"
    - "robotics foundation model"
    - "generalist policy"
    - "generalist robot"
    - "기반 모델"
    - "파운데이션 모델"

  # ---- Platform (cobot family + humanoid).
  # Humanoid kept because modern bipedal robots (Figure, 1X, Optimus, H1)
  # increasingly target collaborative / shared-workspace deployment.
  # Quadrupeds / UGVs / drones remain out of scope.
  "#Manipulator":
    - manipulator
    - manipulation        # general manipulation work counts as arm/manipulator
    - "robot arm"
    - "robotic arm"
    - grasping
    - grasp
    - "pick and place"
    - "pick-and-place"
    - dexterous
    - "end-effector"
    - "end effector"
    - "franka"
    - "panda arm"
    - "ur5"
    - "ur10"
    - "ur3"
    - "kuka"
    - "xarm"
    - "iiwa"
    - 로봇팔
    - 매니퓰레이터
    - 그리퍼
    - 파지
    - 집기
  "#Bimanual":
    - bimanual
    - "two-arm"
    - "dual-arm"
    - "two arm"
    - "dual arm"
    - "two-handed"
    - aloha
    - 양팔
    - 양손
  "#MobileManipulator":
    - mobile manipulator
    - "mobile manipulation"
    - "stretch robot"
    - "hello robot stretch"
    - tiago
    - "fetch robot"
    - "mobile aloha"
    - tidybot
    - "wheeled manipulator"
    - 모바일 매니퓰레이터
    - 이동 조작
  "#Humanoid":
    - humanoid
    - bipedal
    - biped
    - "boston dynamics atlas"
    - "unitree h1"
    - "unitree g1"
    - "tesla optimus"
    - "figure 01"
    - "figure 02"
    - "1x neo"
    - "agility digit"
    - "whole-body humanoid"
    - 휴머노이드
    - 이족보행
    - 인간형 로봇

# Tag chip groups. Method and Platform are **independent filter dimensions** —
# users can pick one from each (e.g. #VLA + #Manipulator). The site renders
# them as two chip rows with separate `data-filter` keys.
tag_groups:
  - label: Method
    filter_key: method
    tags: ["#RL", "#IL", "#VLA"]
  - label: Platform
    filter_key: platform
    # #Other is the platform catch-all — items matching none of the 4 above.
    tags: ["#Manipulator", "#Bimanual", "#MobileManipulator", "#Humanoid", "#Other"]

sources:
  arxiv:
    enabled: true
    categories: [cs.RO, cs.AI, cs.LG, cs.CV]
    days_back: 7
    max_results_per_category: 100
    # arXiv is high-volume. Drop papers scoring below this relevance floor
    # (navigation/SLAM/generic-ML noise that trips a keyword but misses our
    # research interests). 0 disables. See ranking weights below for the scale.
    min_score: 6
    # Stricter cut for arXiv WITHOUT released code (papers-only). Keep only
    # High-priority no-code papers scoring >= this threshold; drop Mid/Low and
    # the lower-scoring High no-code papers. With-code arXiv is unaffected.
    no_code_min_score: 16
  github:
    enabled: true
    queries:
      - "robot learning"
      - "diffusion policy"
      - "vision language action"
      - "reinforcement learning robot"
      - "sim-to-real"
      - "isaac lab"
    days_back: 90
    per_page: 30
    min_stars: 10
  news:
    enabled: true
    days_back: 21         # show items posted within the last 3 weeks
    max_per_feed: 40      # cap per feed so a noisy outlet can't drown the rest
    # Count-ratio policy for the visible News section (papers/repos unaffected).
    # All news gets labeled by score percentile (top 60% -> High, next 30% ->
    # Mid, bottom 10% -> Low). The visible slots (news_min_slots) are then
    # allocated to each tier by the same ratio, picking the most recent items
    # within each tier. Result: visible composition is exactly 6:3:1 High:Mid:Low
    # by count. Old items naturally drop out as newer ones in the same tier push
    # them off the most-recent shortlist — no explicit per-tier age cap.
    priority_quota:
      high: 0.6
      mid: 0.3
      low: 0.1
    feeds:
      # --- robotics-focused ---
      - name: "Robohub"
        url: "https://robohub.org/feed/"
      - name: "IEEE Spectrum — Robotics"
