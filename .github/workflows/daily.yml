name: daily

on:
  schedule:
    # 22:00 UTC daily = 07:00 KST. GitHub-scheduled cron can lag 5–30 min;
    # this gives buffer before a typical 08:30 KST work start.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write   # to commit accumulated data back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the monitor (daily mode)
        env:
          # Built-in token; gives ~1000 req/hour for the search API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py --mode daily

      - name: Persist accumulated processed data + state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/state
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "chore: daily data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
