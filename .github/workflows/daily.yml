name: daily

on:
  # Auto-deploy on relevant code/template/config pushes. Skips the heavy
  # collection step (see job below) — just rebuilds the site from data
  # already in the repo, so it's fast and doesn't touch arXiv.
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "*.py"
      - "config.yaml"
      - "collectors/**"
      - "processors/**"
      - "utils/**"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    # 22:00 UTC daily = 07:00 KST. GitHub-scheduled cron can lag 5–30 min;
    # this gives buffer before a typical 08:30 KST work start.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write   # to commit accumulated data back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the monitor (full pipeline — scheduled/manual)
        if: github.event_name != 'push'
        env:
          # Built-in token; gives ~5000 req/hour search + REST.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When set as repo secrets, the pipeline produces LLM summaries
          # instead of the truncation fallback. Both optional — the active one
          # is chosen by summarizer.provider in config.yaml. Without any key,
          # the site still works (truncation summaries).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --no-site so we can interleave thumbnail extraction before building.
        # The next two steps fold the site build back in.
        run: python main.py --mode daily --no-site

      - name: Extract thumbnails for top items (arxiv PDF / github README / news og:image)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/extract_thumbnails.py --max-items 400

      - name: Build site (after collection + thumbnails)
        if: github.event_name != 'push'
        run: python main.py --site-only

      - name: Rebuild site only (after code/template push)
        if: github.event_name == 'push'
        # No network on push — just re-render from data/processed already in
        # the repo. Cheap, deterministic, and avoids hammering arXiv every commit.
        run: python main.py --site-only

      - name: Persist accumulated processed data + state
        # Only after a full collection run; push-triggered rebuilds don't
        # change data files and would commit nothing anyway.
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/state data/thumbnails
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "chore: daily data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
